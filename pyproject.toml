[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stica"
version = "0.1.0"
description = "Spacetime-inhomogeneous cellular automata (STICA) in JAX/CAX, with on-device evolutionary optimisation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# Tested with jax 0.6.2, flax 0.10.7, cax 0.2.1, numpy 1.26 and 2.3.
dependencies = [
    "jax>=0.6,<0.7",
    "flax>=0.10.7,<0.11",
    "cax==0.2.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]>=0.6,<0.7"]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/Carregando1/STICA"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
